[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"

[functions]
  # Use esbuild to produce a self-contained function bundle.
  node_bundler = "esbuild"
  included_files = ["lib/**", "media_gallery/data/meta.json"]

# /api/foo -> function with path /api/foo (via splat under function)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

# static media JSON
[[redirects]]
  from = "/media-data/*"
  to = "/media-data/:splat"
  status = 200
  force = true

# SPA fallback last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
