[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"

[functions]
  node_bundler = "nft"
  # Do NOT bundle multi‑MB media JSON into the function (causes deploy/runtime 502).
  # Media JSON is published under public/media-data and read by the browser.
  included_files = ["lib/**", "server/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

# static media-data must not fall through to SPA
[[redirects]]
  from = "/media-data/*"
  to = "/media-data/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
