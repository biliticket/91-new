[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"

[functions]
  node_bundler = "nft"
  included_files = [
    "media_gallery/data/**",
    "lib/**",
    "server/**"
  ]

# /api/media/meta  -> function path /.netlify/functions/api/media/meta
# then handler rewrites to /api/media/meta for Express
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

# SPA fallback last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
