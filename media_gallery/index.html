<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>91 Media Gallery</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --line: #2a3140;
      --text: #e8ecf1;
      --muted: #8b95a8;
      --accent: #5b8cff;
      --accent2: #3dd6c6;
      --danger: #ff6b7a;
      --card: #1c212b;
      --shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2744 0%, transparent 55%),
                  radial-gradient(900px 500px at 100% 0%, #152a28 0%, transparent 45%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(10px);
      background: rgba(15,17,21,.82);
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    h1 { font-size: 16px; margin: 0; letter-spacing: .2px; font-weight: 650; }
    .stats { color: var(--muted); font-size: 12px; }
    .tabs { display: flex; gap: 8px; margin-left: auto; }
    .tab, button, select, input {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .tab.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .tab { cursor: pointer; }
    .search { min-width: 220px; flex: 1; max-width: 360px; }
    main { padding: 16px 18px 80px; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 14px; color: var(--muted); font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: #3b465c; }
    .thumb {
      aspect-ratio: 3/4;
      background: #0b0d12;
      position: relative;
      overflow: hidden;
    }
    .thumb.video { aspect-ratio: 16/10; }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0b0d12;
    }
    .thumb .ph {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #6b7385; font-size: 12px;
      background: linear-gradient(180deg,#151a24,#0b0d12);
    }
    .badge {
      position: absolute; left: 8px; top: 8px;
      background: rgba(0,0,0,.65);
      border: 1px solid rgba(255,255,255,.12);
      padding: 3px 7px; border-radius: 999px; font-size: 11px;
    }
    .meta { padding: 10px; font-size: 12px; color: var(--muted); }
    .meta .title {
      color: var(--text); font-size: 13px; margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .path {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px; word-break: break-all; color: #9aa6bb;
    }
    .pager {
      display: flex; gap: 8px; justify-content: center; align-items: center;
      margin-top: 18px;
    }
    .pager button { cursor: pointer; }
    .pager button:disabled { opacity: .4; cursor: not-allowed; }

    .modal {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,.72);
      display: none; align-items: center; justify-content: center;
      padding: 18px;
    }
    .modal.open { display: flex; }
    .modal-box {
      width: min(1100px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .modal-head {
      display: flex; gap: 10px; align-items: center;
      padding: 12px 14px; border-bottom: 1px solid var(--line);
    }
    .modal-head .close { margin-left: auto; cursor: pointer; }
    .modal-body { padding: 14px; }
    video, img.preview {
      width: 100%; max-height: 70vh; object-fit: contain;
      background: #000; border-radius: 12px;
    }
    .links a {
      color: var(--accent2); word-break: break-all; font-size: 12px;
    }
    .empty {
      border: 1px dashed var(--line); border-radius: 14px;
      padding: 40px; text-align: center; color: var(--muted);
    }
    .err { color: var(--danger); font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>91 Media Gallery</h1>
      <div class="stats" id="stats">loading…</div>
    </div>
    <input class="search" id="q" placeholder="搜索路径 / id / 标题" />
    <div class="tabs">
      <button class="tab active" data-tab="images">图片</button>
      <button class="tab" data-tab="videos">视频表</button>
      <button class="tab" data-tab="media_videos">帖子视频</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <span id="pageInfo">—</span>
      <select id="pageSize">
        <option value="48">48 / 页</option>
        <option value="96" selected>96 / 页</option>
        <option value="192">192 / 页</option>
      </select>
      <button id="refreshSign" title="重新生成 HLS 签名">刷新视频签名</button>
    </div>
    <div id="grid" class="grid"></div>
    <div class="pager">
      <button id="prev">上一页</button>
      <span id="pageNum">1</span>
      <button id="next">下一页</button>
    </div>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-head">
        <strong id="modalTitle">预览</strong>
        <button class="close" id="closeModal">关闭</button>
      </div>
      <div class="modal-body">
        <div id="playerWrap"></div>
        <div class="links" id="modalLinks" style="margin-top:12px"></div>
        <div class="err" id="modalErr"></div>
      </div>
    </div>
  </div>

  <script>
    const HLS_KEY = 'RnOxyCIc5eDPFpJY';
    const VID_CDN = 'https://hls.ffxddn.cn';
    const IMG_CDN = 'https://pic.jjlxoi.cn';

    const IMG_CDNS = [
      'https://pic.jjlxoi.cn',
      'https://pic.uforxk.cn',
      'https://imgpublic.ycomesc.live',
      'https://image.qzycbu.cn',
      'https://new.qzycbu.cn',
      'https://pwa.eisees.com'
    ];

    function pathOnly(u) {
      if (!u) return '';
      let s = String(u);
      if (s.startsWith('http://') || s.startsWith('https://')) {
        try { s = new URL(s).pathname; } catch {}
      }
      if (s && !s.startsWith('/')) s = '/' + s;
      return s;
    }

    function candidateImageUrls(it) {
      const urls = [];
      const push = (u) => { if (u && !urls.includes(u)) urls.push(u); };
      if (Array.isArray(it.cdn_urls)) it.cdn_urls.forEach(push);
      push(it.thumb); push(it.cover); push(it.url);
      const p = pathOnly(it.path || it.cover_path || it.thumb || it.cover || it.url || '');
      if (p) {
        for (const base of IMG_CDNS) push(base + p);
      }
      return urls;
    }

    function bindImgFallback(img, urls) {
      let i = 0;
      const tryNext = () => {
        if (i >= urls.length) {
          img.style.display = 'none';
          const ph = img.parentElement && img.parentElement.querySelector('.ph');
          if (ph) ph.style.display = 'flex';
          return;
        }
        img.src = urls[i++];
      };
      img.onload = () => {
        const ph = img.parentElement && img.parentElement.querySelector('.ph');
        if (ph) ph.style.display = 'none';
      };
      img.onerror = tryNext;
      tryNext();
    }


    const state = {
      tab: 'images',
      page: 1,
      pageSize: 96,
      q: '',
      meta: null,
      videos: null,
      mediaVideos: null,
      imageChunks: [],
      imageCache: new Map(), // chunkIndex -> items
      filtered: [],
      total: 0,
    };

    function md5(str) {
      // compact md5
      function cmn(q,a,b,x,s,t){a=a+(q+x+t)|0;return(((a<<s)|(a>>> (32-s)))+b)|0}
      function ff(a,b,c,d,x,s,t){return cmn((b&c)|((~b)&d),a,b,x,s,t)}
      function gg(a,b,c,d,x,s,t){return cmn((b&d)|(c&(~d)),a,b,x,s,t)}
      function hh(a,b,c,d,x,s,t){return cmn(b^c^d,a,b,x,s,t)}
      function ii(a,b,c,d,x,s,t){return cmn(c^(b|(~d)),a,b,x,s,t)}
      function md51(s){
        const n=s.length, state=[1732584193,-271733879,-1732584194,271733878];
        let i;
        for(i=64;i<=n;i+=64) md5cycle(state, md5blk(s.substring(i-64,i)));
        s=s.substring(i-64);
        const tail=Array(16).fill(0);
        for(i=0;i<s.length;i++) tail[i>>2]|=s.charCodeAt(i)<<((i%4)<<3);
        tail[i>>2]|=0x80<<((i%4)<<3);
        if(i>55){md5cycle(state,tail); for(i=0;i<16;i++) tail[i]=0}
        tail[14]=n*8; md5cycle(state,tail); return state;
      }
      function md5cycle(x,k){
        let [a,b,c,d]=x;
        a=ff(a,b,c,d,k[0],7,-680876936); d=ff(d,a,b,c,k[1],12,-389564586); c=ff(c,d,a,b,k[2],17,606105819); b=ff(b,c,d,a,k[3],22,-1044525330);
        a=ff(a,b,c,d,k[4],7,-176418897); d=ff(d,a,b,c,k[5],12,1200080426); c=ff(c,d,a,b,k[6],17,-1473231341); b=ff(b,c,d,a,k[7],22,-45705983);
        a=ff(a,b,c,d,k[8],7,1770035416); d=ff(d,a,b,c,k[9],12,-1958414417); c=ff(c,d,a,b,k[10],17,-42063); b=ff(b,c,d,a,k[11],22,-1990404162);
        a=ff(a,b,c,d,k[12],7,1804603682); d=ff(d,a,b,c,k[13],12,-40341101); c=ff(c,d,a,b,k[14],17,-1502002290); b=ff(b,c,d,a,k[15],22,1236535329);
        a=gg(a,b,c,d,k[1],5,-165796510); d=gg(d,a,b,c,k[6],9,-1069501632); c=gg(c,d,a,b,k[11],14,643717713); b=gg(b,c,d,a,k[0],20,-373897302);
        a=gg(a,b,c,d,k[5],5,-701558691); d=gg(d,a,b,c,k[10],9,38016083); c=gg(c,d,a,b,k[15],14,-660478335); b=gg(b,c,d,a,k[4],20,-405537848);
        a=gg(a,b,c,d,k[9],5,568446438); d=gg(d,a,b,c,k[14],9,-1019803690); c=gg(c,d,a,b,k[3],14,-187363961); b=gg(b,c,d,a,k[8],20,1163531501);
        a=gg(a,b,c,d,k[13],5,-1444681467); d=gg(d,a,b,c,k[2],9,-51403784); c=gg(c,d,a,b,k[7],14,1735328473); b=gg(b,c,d,a,k[12],20,-1926607734);
        a=hh(a,b,c,d,k[5],4,-378558); d=hh(d,a,b,c,k[8],11,-2022574463); c=hh(c,d,a,b,k[11],16,1839030562); b=hh(b,c,d,a,k[14],23,-35309556);
        a=hh(a,b,c,d,k[1],4,-1530992060); d=hh(d,a,b,c,k[4],11,1272893353); c=hh(c,d,a,b,k[7],16,-155497632); b=hh(b,c,d,a,k[10],23,-1094730640);
        a=hh(a,b,c,d,k[13],4,681279174); d=hh(d,a,b,c,k[0],11,-358537222); c=hh(c,d,a,b,k[3],16,-722521979); b=hh(b,c,d,a,k[6],23,76029189);
        a=hh(a,b,c,d,k[9],4,-640364487); d=hh(d,a,b,c,k[12],11,-421815835); c=hh(c,d,a,b,k[15],16,530742520); b=hh(b,c,d,a,k[2],23,-995338651);
        a=ii(a,b,c,d,k[0],6,-198630844); d=ii(d,a,b,c,k[7],10,1126891415); c=ii(c,d,a,b,k[14],15,-1416354905); b=ii(b,c,d,a,k[5],21,-57434055);
        a=ii(a,b,c,d,k[12],6,1700485571); d=ii(d,a,b,c,k[3],10,-1894986606); c=ii(c,d,a,b,k[10],15,-1051523); b=ii(b,c,d,a,k[1],21,-2054922799);
        a=ii(a,b,c,d,k[8],6,1873313359); d=ii(d,a,b,c,k[15],10,-30611744); c=ii(c,d,a,b,k[6],15,-1560198380); b=ii(b,c,d,a,k[13],21,1309151649);
        a=ii(a,b,c,d,k[4],6,-145523070); d=ii(d,a,b,c,k[11],10,-1120210379); c=ii(c,d,a,b,k[2],15,718787259); b=ii(b,c,d,a,k[9],21,-343485551);
        x[0]=(a+x[0])|0; x[1]=(b+x[1])|0; x[2]=(c+x[2])|0; x[3]=(d+x[3])|0;
      }
      function md5blk(s){const md5blks=[]; for(let i=0;i<64;i+=4) md5blks[i>>2]=s.charCodeAt(i)+(s.charCodeAt(i+1)<<8)+(s.charCodeAt(i+2)<<16)+(s.charCodeAt(i+3)<<24); return md5blks}
      function rhex(n){let s='',j=0; for(;j<4;j++) s+=('0'+((n>>(j*8+4))&0x0F).toString(16))+((n>>(j*8))&0x0F).toString(16); return s}
      function hex(x){for(let i=0;i<x.length;i++) x[i]=rhex(x[i]); return x.join('')}
      return hex(md51(unescape(encodeURIComponent(str))));
    }

    function signVideo(path, v='3', t1='0') {
      if (!path) return '';
      let p = path;
      if (p.startsWith('http')) {
        try { p = new URL(p).pathname; } catch {}
      }
      if (!p.startsWith('/')) p = '/' + p;
      const timeNow = Math.floor(Date.now()/1000);
      const rand = md5(p + timeNow).slice(0,13);
      const uid = v === '3' ? t1 : '0';
      const data = `${p}-${timeNow}-${rand}-${uid}-${HLS_KEY}`;
      const sign = md5(data);
      return `${VID_CDN}${p}?auth_key=${timeNow}-${rand}-${uid}-${sign}&v=${v}&time=${t1}`;
    }

    async function loadJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(url + ' ' + r.status);
      return r.json();
    }

    async function ensureVideos() {
      if (!state.videos) state.videos = await loadJSON('data/videos.json');
      if (!state.mediaVideos) state.mediaVideos = await loadJSON('data/media_videos.json');
    }

    async function loadImagePageItems() {
      // For images we filter across loaded chunks lazily.
      // Simple strategy: load all chunk indexes from meta, then load needed chunks on demand.
      // For search, load all chunks progressively if query present.
      const chunks = state.meta.image_chunks || [];
      const q = state.q.trim().toLowerCase();
      if (!q) {
        // no search: compute global page into chunk
        const start = (state.page - 1) * state.pageSize;
        const end = start + state.pageSize;
        state.total = state.meta.counts.post_media_images || 0;
        const items = [];
        for (let i = start; i < end && i < state.total; i++) {
          const cidx = Math.floor(i / 5000);
          const local = i % 5000;
          if (!state.imageCache.has(cidx)) {
            const file = chunks[cidx].file;
            state.imageCache.set(cidx, await loadJSON(file));
          }
          const arr = state.imageCache.get(cidx);
          if (arr[local]) items.push(arr[local]);
        }
        return items;
      }
      // search mode: scan all chunks (cached)
      let all = [];
      for (let cidx = 0; cidx < chunks.length; cidx++) {
        if (!state.imageCache.has(cidx)) {
          state.imageCache.set(cidx, await loadJSON(chunks[cidx].file));
        }
        all = all.concat(state.imageCache.get(cidx));
      }
      const filtered = all.filter(it =>
        String(it.id).includes(q) ||
        (it.path || '').toLowerCase().includes(q) ||
        String(it.pid).includes(q)
      );
      state.total = filtered.length;
      const start = (state.page - 1) * state.pageSize;
      return filtered.slice(start, start + state.pageSize);
    }

    async function currentItems() {
      await ensureVideos();
      const q = state.q.trim().toLowerCase();
      if (state.tab === 'images') return loadImagePageItems();
      let arr = state.tab === 'videos' ? state.videos : state.mediaVideos;
      if (q) {
        arr = arr.filter(it =>
          String(it.id).includes(q) ||
          (it.path || '').toLowerCase().includes(q) ||
          (it.title || '').toLowerCase().includes(q) ||
          String(it.pid || '').includes(q)
        );
      }
      state.total = arr.length;
      const start = (state.page - 1) * state.pageSize;
      return arr.slice(start, start + state.pageSize);
    }

    function fmtDur(sec) {
      sec = Number(sec) || 0;
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${String(s).padStart(2,'0')}`;
    }

    function cardHTML(it) {
      const isVideo = it.kind === 'video' || state.tab !== 'images';
      const title = displayName(it);
      const badge = isVideo ? `VIDEO ${fmtDur(it.duration)}` : `IMG ${it.w||'?'}x${it.h||'?'}`;
      const urls = candidateImageUrls(it);
      const first = urls[0] || '';
      return `<div class="card" data-id="${it.id}" data-kind="${isVideo ? 'video' : 'image'}">
        <div class="thumb ${isVideo ? 'video' : ''}">
          <div class="ph" style="display:flex">无图</div>
          <img alt="" loading="lazy" referrerpolicy="no-referrer" data-cands="${escAttr(urls.join('|'))}" src="${escAttr(first)}" />
          <div class="badge">${badge}</div>
        </div>
        <div class="meta">
          <div class="title">${escapeHtml(title)}</div>
          <div class="path">${escapeHtml(it.path || '')}</div>
        </div>
      </div>`;
    }

    function escAttr(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;');
    }

    
    function fileName(path) {
      if (!path) return '';
      try {
        const p = String(path).split('?')[0];
        const segs = p.split('/').filter(Boolean);
        return decodeURIComponent(segs[segs.length - 1] || p);
      } catch { return String(path); }
    }
    function displayName(it) {
      const hack = /hacked by dimples|dimples#1337/i;
      const t = it.title || it.name || '';
      if (t && !hack.test(t)) return t;
      return fileName(it.path) || fileName(it.cover_path) || fileName(it.url) || ('#' + it.id);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '<div class="empty">加载中…</div>';
      try {
        const items = await currentItems();
        if (!items.length) {
          grid.innerHTML = '<div class="empty">没有数据</div>';
        } else {
          grid.innerHTML = items.map(cardHTML).join('');
          grid.querySelectorAll('.card').forEach((el, idx) => {
            el.addEventListener('click', () => openItem(items[idx]));
            const img = el.querySelector('img');
            if (img) {
              const cands = (img.dataset.cands || '').split('|').filter(Boolean);
              if (cands.length) bindImgFallback(img, cands);
            }
          });
        }
        const pages = Math.max(1, Math.ceil(state.total / state.pageSize));
        document.getElementById('pageInfo').textContent = `共 ${state.total} 条 · 第 ${state.page}/${pages} 页`;
        document.getElementById('pageNum').textContent = `${state.page} / ${pages}`;
        document.getElementById('prev').disabled = state.page <= 1;
        document.getElementById('next').disabled = state.page >= pages;
      } catch (e) {
        grid.innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message)}</div>`;
      }
    }

    let hls;
    function openItem(it) {
      const modal = document.getElementById('modal');
      const wrap = document.getElementById('playerWrap');
      const links = document.getElementById('modalLinks');
      const err = document.getElementById('modalErr');
      err.textContent = '';
      document.getElementById('modalTitle').textContent = displayName(it);
      if (hls) { hls.destroy(); hls = null; }
      wrap.innerHTML = '';
      const isVideo = it.kind === 'video' || state.tab !== 'images';
      if (isVideo) {
        const play = it.play_url || signVideo(it.path);
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        wrap.appendChild(video);
        if (play.includes('.m3u8') && window.Hls && Hls.isSupported()) {
          hls = new Hls({ enableWorker: true });
          hls.loadSource(play);
          hls.attachMedia(video);
          hls.on(Hls.Events.ERROR, (_, data) => {
            err.textContent = '播放失败（CDN 可能校验 IP/UA，或签名过期）：' + (data?.type || '') + ' ' + (data?.details || '');
          });
        } else {
          video.src = play;
        }
        links.innerHTML = `
          <div>path: <code>${escapeHtml(it.path||'')}</code></div>
          <div>play: <a href="${play}" target="_blank" rel="noreferrer">${escapeHtml(play)}</a></div>
          ${it.cover ? `<div>cover: <a href="${it.cover}" target="_blank" rel="noreferrer">${escapeHtml(it.cover)}</a></div>` : ''}
        `;
      } else {
        const url = it.url || it.thumb;
        const urls = candidateImageUrls(it);
        wrap.innerHTML = `<div style="position:relative"><div class="ph" style="display:flex;min-height:240px">加载中…</div><img class="preview" alt="" referrerpolicy="no-referrer" /></div>`;
        const img = wrap.querySelector('img');
        bindImgFallback(img, urls.length ? urls : [url].filter(Boolean));
        links.innerHTML = `
          <div>path: <code>${escapeHtml(it.path||'')}</code></div>
          <div>url: <a href="${url}" target="_blank" rel="noreferrer">${escapeHtml(url)}</a></div>
        `;
      }
      modal.classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      if (hls) { hls.destroy(); hls = null; }
      document.getElementById('playerWrap').innerHTML = '';
    }

    async function init() {
      state.meta = await loadJSON('data/meta.json');
      const c = state.meta.counts;
      document.getElementById('stats').textContent =
        `图片 ${c.post_media_images} · 视频表 ${c.videos_table} · 帖子视频 ${c.post_media_videos} · CDN ${state.meta.img_cdn}`;
      await render();
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.tab = btn.dataset.tab;
        state.page = 1;
        render();
      });
    });
    document.getElementById('q').addEventListener('input', (e) => {
      state.q = e.target.value;
      state.page = 1;
      clearTimeout(window.__qtimer);
      window.__qtimer = setTimeout(render, 250);
    });
    document.getElementById('pageSize').addEventListener('change', (e) => {
      state.pageSize = Number(e.target.value);
      state.page = 1;
      render();
    });
    document.getElementById('prev').onclick = () => { state.page = Math.max(1, state.page - 1); render(); };
    document.getElementById('next').onclick = () => { state.page += 1; render(); };
    document.getElementById('closeModal').onclick = closeModal;
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });
    document.getElementById('refreshSign').onclick = async () => {
      // re-sign video lists in memory
      await ensureVideos();
      for (const it of state.videos) it.play_url = signVideo(it.path);
      for (const it of state.mediaVideos) it.play_url = signVideo(it.path);
      alert('视频签名已刷新（对当前已加载列表生效）');
    };

    init().catch(e => {
      document.getElementById('stats').textContent = '加载失败: ' + e.message;
    });
  </script>
</body>
</html>
