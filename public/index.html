<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#000000" />
  <title>媒体库</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/media/images" id="brand" aria-label="媒体库首页">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">媒体库</span>
        </a>
        <form class="search" id="searchForm" autocomplete="off" role="search">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10.5 3a7.5 7.5 0 0 1 5.94 12.09l4.24 4.24a1 1 0 0 1-1.41 1.41l-4.24-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z" fill="currentColor"/>
          </svg>
          <input id="searchInput" type="search" placeholder="搜索文件名 / 路径 / id" enterkeyhint="search" aria-label="搜索" />
          <button type="reset" class="search-clear" id="searchClear" aria-label="清除" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M10 1.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17Zm2.83 5.67a.75.75 0 0 1 0 1.06L11.06 10l1.77 1.77a.75.75 0 1 1-1.06 1.06L10 11.06l-1.77 1.77a.75.75 0 0 1-1.06-1.06L8.94 10 7.17 8.23a.75.75 0 1 1 1.06-1.06L10 8.94l1.77-1.77a.75.75 0 0 1 1.06 0Z" fill="currentColor"/>
            </svg>
          </button>
        </form>
      </div>
      <nav class="cats" id="cats" aria-label="媒体类型"></nav>
      <div class="scroll-edge" aria-hidden="true"></div>
    </header>

    <main id="main" class="main">
      <div class="state" id="state">
        <span class="spinner" aria-hidden="true"></span>
      </div>
    </main>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
